services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ..:/workspaces/springboot-workshop:cached
    command: sleep infinity
    environment:
      SPRING_PROFILES_ACTIVE: default
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://database:5432/ecommerce_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-bookworm
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ecommerce_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: